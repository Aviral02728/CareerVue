services:
  - type: web
    name: careervue-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CAREERVUE_SPACY_MODEL
        value: en_core_web_sm
      - key: CAREERVUE_ENABLE_EMBEDDINGS
        value: "false"
      - key: CAREERVUE_ENABLE_RERANKER
        value: "false"
